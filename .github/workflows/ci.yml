name: Stock Movement MLOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
        # Note: Swap to workload_identity_provider if required by OPPE instructions

    - name: Setup CML
      uses: iterative/setup-cml@v1

    - name: Pull versioned data from DVC
      run: dvc pull

    - name: Run Feature Sanity Tests
      run: pytest tests/test_features.py

    - name: Evaluate Model
      run: python src/evaluate.py

    - name: Generate CML Report
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "## Stock Movement Predictor Evaluation" > report.md
        echo "### Test Set Metrics" >> report.md
        echo '```text' >> report.md
        cat metrics.txt >> report.md
        echo '```' >> report.md
        echo "### Confusion Matrix" >> report.md
        echo "![Confusion Matrix](./confusion_matrix.png)" >> report.md
        
        cml comment create report.md
