name: Stock Movement MLOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    
    # CRITICAL: Permissions for both WIF (id-token) and CML (contents/pull-requests)
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
    # 1. Download repository (Updated to v4)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup Python (Updated to v5)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Install dependencies (Added pip upgrade)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Authenticate to GCP via WIF (v2)
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    # 5. Setup CML (Updated to v2)
    - name: Setup CML
      uses: iterative/setup-cml@v2

    # 6. Fetch Data and MLflow Registry from GCS
    - name: Pull versioned data from DVC
      run: dvc pull

    # 7. Run Sanity Tests (Added PYTHONPATH=.)
    - name: Run Feature Sanity Tests
      run: PYTHONPATH=. pytest tests/test_features.py -v

    # 8. Evaluate Model (Added PYTHONPATH=.)
    - name: Evaluate Model
      run: PYTHONPATH=. python src/evaluate.py

    # 9. Generate and Post CML Report
    - name: Generate CML Report
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "## Stock Movement Predictor Evaluation" > report.md
        echo "### Test Set Metrics" >> report.md
        echo '```text' >> report.md
        cat metrics.txt >> report.md
        echo '```' >> report.md
        echo "### Confusion Matrix" >> report.md
        echo "![Confusion Matrix](./confusion_matrix.png)" >> report.md
        
        cml comment create report.md